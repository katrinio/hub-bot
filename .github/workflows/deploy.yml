name: 🚀 Deploy 'Hub Bot'

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run tests
        run: poetry run pytest

      - name: Run Ruff
        run: poetry run ruff check .

      - name: Run MyPy
        run: poetry run mypy src

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          script: |
            set -euo pipefail

            cd ~/projects/hub-bot

            git fetch origin main
            git reset --hard origin/main

            if [ ! -s .env ]; then
              echo "Production env file is missing or empty: $(pwd)/.env"
              exit 1
            fi

            infisical_auth_file="$HOME/.config/infisical/hub-bot-auth.env"
            if [ ! -r "$infisical_auth_file" ]; then
              echo "Infisical Machine Identity credentials are missing or unreadable"
              exit 1
            fi

            # shellcheck disable=SC1090
            . "$infisical_auth_file"
            : "${INFISICAL_CLIENT_ID:?INFISICAL_CLIENT_ID is missing}"
            : "${INFISICAL_CLIENT_SECRET:?INFISICAL_CLIENT_SECRET is missing}"
            : "${INFISICAL_PROJECT_ID:?INFISICAL_PROJECT_ID is missing}"

            INFISICAL_TOKEN="$(infisical login \
              --method=universal-auth \
              --client-id="$INFISICAL_CLIENT_ID" \
              --client-secret="$INFISICAL_CLIENT_SECRET" \
              --silent \
              --plain)"
            export INFISICAL_TOKEN
            unset INFISICAL_CLIENT_ID INFISICAL_CLIENT_SECRET

            infisical_compose() {
              infisical run \
                --projectId="$INFISICAL_PROJECT_ID" \
                --env=prod \
                --path=/hub-bot \
                -- docker compose "$@"
            }

            infisical_compose config --quiet
            mkdir -p data/watcher

            infisical_compose build

            infisical_compose run --rm hub-bot alembic upgrade head

            infisical_compose up -d --remove-orphans

            sleep 5
            infisical_compose ps

            container_id="$(infisical_compose ps -q hub-bot)"
            if [ -z "$container_id" ]; then
              echo "hub-bot container is missing after deploy"
              infisical_compose ps
              infisical_compose logs --tail=100 hub-bot
              exit 1
            fi

            container_status="$(docker inspect -f '{{.State.Status}}' "$container_id")"
            restarting="$(docker inspect -f '{{.State.Restarting}}' "$container_id")"

            if [ "$container_status" != "running" ] || [ "$restarting" = "true" ]; then
              echo "hub-bot container is not healthy after deploy: status=$container_status restarting=$restarting"
              infisical_compose ps
              infisical_compose logs --tail=100 hub-bot
              exit 1
            fi

            infisical_compose exec -T hub-bot alembic current

            infisical_compose logs --tail=50 hub-bot
            docker image prune -f
